<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        UNO Show 'Em No Mercy
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <h1>
        UNO NO MERCY
    </h1>

    <!-- GUEST -->

    <div id="guest-name"></div>

    <!-- MENU -->

    <div id="menu">

        <button id="create-room-btn">
            Create Room
        </button>

        <br><br>

        <input
            id="room-input"
            placeholder="Room Code"
        >

        <button id="join-room-btn">
            Join Room
        </button>

    </div>

    <!-- WAITING -->

    <div id="waiting-screen">

        <h2>
            Waiting for Players...
        </h2>

        <p>
            Room Code:
            <span id="room-code-text"></span>
        </p>

    </div>

    <!-- GAME -->

    <div id="game">

        <div id="turn-text"></div>

        <div id="top-card"></div>

        <div id="hand"></div>

        <button id="draw-btn">
            Draw Card
        </button>

    </div>

    <!-- SOCKET -->

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <!-- JS -->

    <script src="js/cards.js"></script>

    <script src="js/rules.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/socket.js"></script>

    <script src="js/game.js"></script>

</body>

</html>
